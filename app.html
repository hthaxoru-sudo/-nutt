option value="admin" ${u.role==='admin'?'selected':''}>Admin ทั่วไป</option></select></div>`:''}<button class="btn primary">บันทึกการเปลี่ยนแปลง</button></form>`);euf.onsubmit=e=>{e.preventDefault();let users=R(DB.users),uu=users.find(x=>x.username===username),chars=R(DB.chars),cc=chars.find(x=>x.username===username);Object.assign(cc,{name:eun.value.trim(),dob:eud.value.trim(),gender:eug.value.trim(),phone:euphone.value.trim(),job:eujob.value.trim()||'พลเมือง',rank:eurank.value.trim()||'พลเมือง',level:Number(eul.value||1),xp:Number(euxp.value||0),money:Number(eum.value||0)});if(eup.value.trim())uu.password=eup.value.trim();if(uu.role!=='superadmin'){uu.role=eur.value;uu.roleName=ROLE_NAMES[eur.value]}W(DB.users,users);W(DB.chars,chars);if(me().username===username)setCurrent(uu);logAction('แก้ไขผู้ใช้',username);closeModal();render()}}
function adminDepartments(){return `<div class="page-head"><div><h2>🏢 จัดการหน่วยงาน</h2><p>เพิ่ม แก้ไข ลบหัวหน้าหน่วย สมาชิก และโครงสร้างหน่วยงาน</p></div><div><button class="btn primary" onclick="adminAddDept()">＋ เพิ่มหน่วยงาน</button></div></div><div class="grid">${R(DB.departments).map(d=>`<section class="card span4 dept"><h3>${esc(d.name)}</h3><p class="muted">หัวหน้า: ${esc(d.chief||'-')}</p><p class="muted">สมาชิก ${d.members?.length||0} คน</p><div class="actions"><button class="btn soft" onclick="adminEditDept('${d.id}')">✏️ แก้ไข</button><button class="btn red" onclick="adminDeleteDept('${d.id}')">ลบ</button></div></section>`).join('')}</div>`}
function adminAddDept(){openModal('เพิ่มหน่วยงาน',`<form id="adf"><div class="field"><label>ชื่อหน่วยงาน</label><input class="input" id="adn" required></div><div class="field"><label>หัวหน้า Username</label><input class="input" id="adc"></div><button class="btn primary">สร้าง</button></form>`);adf.onsubmit=e=>{e.preventDefault();let a=R(DB.departments);a.push({id:uid('dept'),name:adn.value.trim(),chief:adc.value.trim(),members:[]});W(DB.departments,a);logAction('เพิ่มหน่วยงาน',adn.value.trim());closeModal();adminTab('departments')}}
function adminEditDept(id){let a=R(DB.departments),d=a.find(x=>x.id===id);if(!d)return;openModal('แก้ไขหน่วยงาน',`<form id="edf"><div class="field"><label>ชื่อ</label><input class="input" id="edn" value="${esc(d.name)}" required></div><div class="field"><label>หัวหน้า Username</label><input class="input" id="edc" value="${esc(d.chief||'')}"></div><div class="field"><label>สมาชิก Username (คั่นด้วย ,)</label><textarea class="textarea" id="edm">${esc((d.members||[]).join(', '))}</textarea></div><button class="btn primary">บันทึก</button></form>`);edf.onsubmit=e=>{e.preventDefault();Object.assign(d,{name:edn.value.trim(),chief:edc.value.trim(),members:edm.value.split(',').map(x=>x.trim()).filter(Boolean)});W(DB.departments,a);logAction('แก้ไขหน่วยงาน',d.name);closeModal();adminTab('departments')}}
function adminDeleteDept(id){if(!confirm('ลบหน่วยงานนี้หรือไม่?'))return;let d=R(DB.departments).find(x=>x.id===id);W(DB.departments,R(DB.departments).filter(x=>x.id!==id));logAction('ลบหน่วยงาน',d?.name||id);adminTab('departments')}
function adminRecords(){return `<div class="page-head"><div><h2>🪪 เอกสารและประวัติ</h2><p>จัดการบัตรประชาชน ใบอนุญาต และประวัติคดีของทุกคน</p></div></div><div class="table-wrap"><table><thead><tr><th>ประเภท</th><th>เจ้าของ</th><th>ข้อมูล</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${R(DB.ids).map(x=>`<tr><td>🪪 City ID</td><td>${esc(charOf(R(DB.chars).find(c=>c.id===x.char)?.username||'')?.name||x.char)}</td><td>${esc(x.number)}</td><td>${esc(x.status||'-')}</td><td><button class="btn soft" onclick="editID('${x.id}')">✏️ แก้ไข</button><button class="btn red" onclick="deleteID('${x.id}')">ลบ</button></td></tr>`).join('')}${R(DB.licenses).map(x=>`<tr><td>📄 ${esc(x.type)}</td><td>${esc(charOf(R(DB.chars).find(c=>c.id===x.char)?.username||'')?.name||x.char)}</td><td>${esc(x.number)}</td><td>${esc(x.status)}</td><td><button class="btn soft" onclick="editLicense('${x.id}')">✏️ แก้ไข</button><button class="btn red" onclick="deleteLicense('${x.id}')">ลบ</button></td></tr>`).join('')}${R(DB.cases).map(x=>`<tr><td>⚖️ คดี</td><td>${esc(charOf(x.citizen)?.name||x.citizen)}</td><td>${esc(x.number)} • ${esc(x.charge)}</td><td>${esc(x.status)}</td><td><button class="btn soft" onclick="editCase('${x.id}')">✏️ แก้ไข</button><button class="btn red" onclick="deleteCase('${x.id}')">ลบ</button></td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="newID()">＋ ออกบัตร</button><button class="btn primary" onclick="newLicense()">＋ ออกใบอนุญาต</button></div>`}
function newID(){openModal('ออกบัตรประชาชน',`<form id="nid"><div class="field"><label>ตัวละคร</label><select class="select" id="nic">${R(DB.chars).map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.username)}</option>`).join('')}</select></div><div class="field"><label>เลขบัตร</label><input class="input" id="nin" value="CITY-${Math.floor(10000+Math.random()*89999)}" required></div><button class="btn primary">ออกบัตร</button></form>`);nid.onsubmit=e=>{e.preventDefault();let a=R(DB.ids);a.push({id:uid('id'),char:nic.value,number:nin.value.trim(),status:'ใช้งาน'});W(DB.ids,a);logAction('ออกบัตรประชาชน',nin.value.trim());closeModal();adminTab('records')}}
function editID(id){let a=R(DB.ids),x=a.find(q=>q.id===id);if(!x)return;openModal('แก้ไขบัตรประชาชน',`<form id="eid"><div class="field"><label>เลขบัตร</label><input class="input" id="ein" value="${esc(x.number)}"></div><div class="field"><label>สถานะ</label><input class="input" id="eis" value="${esc(x.status||'ใช้งาน')}"></div><button class="btn primary">บันทึก</button></form>`);eid.onsubmit=e=>{e.preventDefault();Object.assign(x,{number:ein.value.trim(),status:eis.value.trim()});W(DB.ids,a);logAction('แก้ไขบัตรประชาชน',x.number);closeModal();adminTab('records')}}
function deleteID(id){if(!confirm('ลบบัตรนี้หรือไม่?'))return;W(DB.ids,R(DB.ids).filter(x=>x.id!==id));logAction('ลบบัตรประชาชน',id);adminTab('records')}
function newLicense(){openModal('ออกใบอนุญาต',`<form id="nlf"><div class="field"><label>ตัวละคร</label><select class="select" id="nlc">${R(DB.chars).map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.username)}</option>`).join('')}</select></div><div class="row2"><div class="field"><label>ประเภท</label><input class="input" id="nlt" value="ใบขับขี่" required></div><div class="field"><label>เลขที่</label><input class="input" id="nln" value="DL-${Math.floor(10000+Math.random()*89999)}" required></div></div><div class="row2"><div class="field"><label>ออกวันที่</label><input class="input" id="nli" value="${dateOnly()}"></div><div class="field"><label>หมดอายุ</label><input class="input" id="nle"></div></div><button class="btn primary">ออกใบอนุญาต</button></form>`);nlf.onsubmit=e=>{e.preventDefault();let a=R(DB.licenses);a.push({id:uid('lic'),char:nlc.value,type:nlt.value.trim(),number:nln.value.trim(),status:'ปกติ',issued:nli.value,expire:nle.value});W(DB.licenses,a);logAction('ออกใบอนุญาต',nln.value.trim());closeModal();adminTab('records')}}
function editLicense(id){let a=R(DB.licenses),x=a.find(q=>q.id===id);if(!x)return;openModal('แก้ไขใบอนุญาต',`<form id="elf"><div class="row2"><div class="field"><label>ประเภท</label><input class="input" id="elt" value="${esc(x.type)}"></div><div class="field"><label>เลขที่</label><input class="input" id="eln" value="${esc(x.number)}"></div></div><div class="row2"><div class="field"><label>สถานะ</label><input class="input" id="els" value="${esc(x.status)}"></div><div class="field"><label>หมดอายุ</label><input class="input" id="ele" value="${esc(x.expire||'')}"></div></div><button class="btn primary">บันทึก</button></form>`);elf.onsubmit=e=>{e.preventDefault();Object.assign(x,{type:elt.value.trim(),number:eln.value.trim(),status:els.value.trim(),expire:ele.value.trim()});W(DB.licenses,a);logAction('แก้ไขใบอนุญาต',x.number);closeModal();adminTab('records')}}
function deleteLicense(id){if(!confirm('ลบใบอนุญาตนี้หรือไม่?'))return;W(DB.licenses,R(DB.licenses).filter(x=>x.id!==id));logAction('ลบใบอนุญาต',id);adminTab('records')}
function adminOperations(){return `<div class="page-head"><div><h2>🚨 Operations Center</h2><p>จัดการ Dispatch และนัดหมายทั้งหมด</p></div></div><div class="grid"><section class="card span6"><h3>Dispatch</h3><p class="muted">ทั้งหมด ${R(DB.dispatch).length} รายการ • เปิดอยู่ ${R(DB.dispatch).filter(x=>x.status!=='ปิดเคส').length}</p><button class="btn red" onclick="location.hash='dispatch'">เปิดหน้า Dispatch</button></section><section class="card span6"><h3>นัดหมาย</h3><p class="muted">ทั้งหมด ${R(DB.appointments).length} รายการ</p><button class="btn primary" onclick="location.hash='appointments'">เปิดหน้านัดหมาย</button></section></div>`}
function adminContent(){return `<div class="page-head"><div><h2>📢 Content Management</h2><p>ข่าวเมืองและประกาศหน่วยงาน</p></div></div><div class="actions"><button class="btn primary" onclick="location.hash='news'">จัดการข่าวเมือง</button><button class="btn soft" onclick="location.hash='deptnews'">จัดการประกาศหน่วยงาน</button></div><div class="grid" style="margin-top:16px"><section class="card span6"><h3>ข่าวเมือง</h3><p class="muted">${R(DB.posts).length} ข่าว</p></section><section class="card span6"><h3>ประกาศหน่วยงาน</h3><p class="muted">${R(DB.deptPosts).length} ประกาศ</p></section></div>`}
function adminSettings(){let s=siteSettings();return `<div class="page-head"><div><h2>⚙️ ตั้งค่าเว็บไซต์</h2><p>เปลี่ยนชื่อเมือง โลโก้ และข้อมูลส่วนกลาง</p></div></div><form id="siteForm" onsubmit="saveSiteSettings(event)"><div class="row2"><div class="field"><label>ชื่อเว็บไซต์</label><input class="input" id="sn" value="${esc(s.name)}"></div><div class="field"><label>ชื่อเมือง</label><input class="input" id="sc" value="${esc(s.city)}"></div></div><div class="field"><label>คำอธิบาย</label><textarea class="textarea" id="sd">${esc(s.description)}</textarea></div><div class="field"><label>Logo</label><input class="input" id="si" type="file" accept="image/*"><div class="muted" style="margin-top:6px">รูปใหม่ไม่เกิน 2 MB</div>${s.logo?`<img src="${s.logo}" style="margin-top:10px;max-width:180px;max-height:90px;border-radius:12px">`:''}</div><div class="field"><label>ข้อความ Footer</label><input class="input" id="sf" value="${esc(s.footer)}"></div><button class="btn primary">💾 บันทึกการตั้งค่า</button></form>`}
function adminLogs(){let a=R(DB.logs);return `<div class="page-head"><div><h2>📜 Admin Activity Logs</h2><p>ตรวจสอบว่า Admin คนใดทำรายการอะไร</p></div></div><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ดำเนินการ</th><th>รายการ</th><th>รายละเอียด</th></tr></thead><tbody>${a.length?a.slice().reverse().map(x=>`<tr><td>${esc(x.time)}</td><td><b>${esc(x.by)}</b></td><td>${esc(x.action)}</td><td>${esc(x.detail||'-')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div>`}
function newUser(){if(!isAdmin())return;openModal('เพิ่มผู้ใช้งาน',`<form id="uf"><div class="row2"><div class="field"><label>Username</label><input class="input" id="uu" required></div><div class="field"><label>Password</label><input class="input" id="up" type="password" required></div></div><div class="field"><label>สิทธิ์</label><select class="select" id="ur"><option value="user">ผู้ใช้ทั่วไป</option><option value="rank1">สมาชิกยศ 1</option><option value="rank2">สมาชิกยศ 2</option><option value="admin">Admin ทั่วไป</option>${isSuperAdmin()?'<option value="superadmin">Super Admin</option>':''}</select></div><button class="btn primary">เพิ่มผู้ใช้</button></form>`);uf.onsubmit=e=>{e.preventDefault();let a=R(DB.users);if(a.some(x=>x.username===uu.value.trim()))return alert('มี Username นี้แล้ว');let r=ur.value;if(r==='superadmin'&&!isSuperAdmin())return;let u={username:uu.value.trim(),password:up.value,role:r,roleName:ROLE_NAMES[r]};a.push(u);W(DB.users,a);W(DB.chars,[...R(DB.chars),{id:uid('char'),username:u.username,name:u.username,dob:'',gender:'',phone:'',rank:'พลเมือง',level:1,xp:0,money:0,job:'พลเมือง',bio:''}]);logAction('เพิ่มผู้ใช้',u.username);closeModal();render()}}
function removeUser(username){if(!isAdmin())return;if(username==='admin_big')return alert('ไม่สามารถลบ Super Admin ที่ได้รับการป้องกันได้');let target=R(DB.users).find(x=>x.username===username);if(target?.role==='superadmin')return alert('ไม่สามารถลบ Super Admin ได้');if(!confirm('ลบผู้ใช้นี้และข้อมูลตัวละครหรือไม่?'))return;W(DB.users,R(DB.users).filter(x=>x.username!==username));W(DB.chars,R(DB.chars).filter(x=>x.username!==username));logAction('ลบผู้ใช้',username);render()}

function saveSiteSettings(e){e.preventDefault();if(!isAdmin())return;let s=siteSettings();s.name=sn.value.trim()||'FriendHub RP';s.city=sc.value.trim()||'City Management';s.description=sd.value.trim();s.footer=sf.value.trim();let f=si.files[0];const done=()=>{W(DB.settings,s);logAction('แก้ไขการตั้งค่าเว็บไซต์',s.name);renderTop();adminTab('settings')};if(f){if(f.size>2*1024*1024)return alert('รูปต้องไม่เกิน 2 MB');let r=new FileReader();r.onload=()=>{s.logo=r.result;done()};r.readAsDataURL(f)}else done()}
function renderTop(){let u=me(),s=siteSettings();sideName.textContent=u.username;sideRole.textContent=u.roleName;topBadge.textContent=u.roleName;if(isAdmin())adminNav.classList.remove('hidden');document.title=s.name+' | RP';document.querySelector('.brand b').textContent=s.name;document.querySelector('.brand small').textContent=s.city;document.querySelector('.footer').textContent=s.footer||s.name+' • City Management';const mark=document.querySelector('.brand-mark');if(s.logo){mark.innerHTML='<img src=\"'+s.logo+'\" style=\"width:100%;height:100%;object-fit:cover;border-radius:11px\">'}else mark.textContent='F'}
renderTop();render();

function adminLogs(){let a=R(DB.logs);return `<div class="page-head"><div><h2>📜 Admin Activity Logs</h2><p>ตรวจสอบว่า Admin คนใดทำรายการอะไร</p></div></div><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ดำเนินการ</th><th>รายการ</th><th>รายละเอียด</th></tr></thead><tbody>${a.length?a.slice().reverse().map(x=>`<tr><td>${esc(x.time)}</td><td><b>${esc(x.by)}</b></td><td>${esc(x.action)}</td><td>${esc(x.detail||'-')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div>`}
function newUser(){if(!isAdmin())return;openModal('เพิ่มผู้ใช้งาน',`<form id="uf"><div class="row2"><div class="field"><label>Username</label><input class="input" id="uu" required></div><div class="field"><label>Password</label><input class="input" id="up" type="password" required></div></div><div class="field"><label>สิทธิ์</label><select class="select" id="ur"><option value="user">ผู้ใช้ทั่วไป</option><option value="rank1">สมาชิกยศ 1</option><option value="rank2">สมาชิกยศ 2</option><option value="admin">Admin ทั่วไป</option>${isSuperAdmin()?'<option value="superadmin">Super Admin</option>':''}</select></div><button class="btn primary">เพิ่มผู้ใช้</button></form>`);uf.onsubmit=e=>{e.preventDefault();let a=R(DB.users);if(a.some(x=>x.username===uu.value.trim()))return alert('มี Username นี้แล้ว');let r=ur.value;if(r==='superadmin'&&!isSuperAdmin())return;let u={username:uu.value.trim(),password:up.value,role:r,roleName:ROLE_NAMES[r]};a.push(u);W(DB.users,a);W(DB.chars,[...R(DB.chars),{id:uid('char'),username:u.username,name:u.username,dob:'',gender:'',phone:'',rank:'พลเมือง',level:1,xp:0,money:0,job:'พลเมือง',bio:''}]);logAction('เพิ่มผู้ใช้',u.username);closeModal();render()}}
function removeUser(username){if(!isAdmin())return;if(username==='admin_big')return alert('ไม่สามารถลบ Super Admin ที่ได้รับการป้องกันได้');let target=R(DB.users).find(x=>x.username===username);if(target?.role==='superadmin')return alert('ไม่สามารถลบ Super Admin ได้');if(!confirm('ลบผู้ใช้นี้และข้อมูลตัวละครหรือไม่?'))return;W(DB.users,R(DB.users).filter(x=>x.username!==username));W(DB.chars,R(DB.chars).filter(x=>x.username!==username));logAction('ลบผู้ใช้',username);render()}

function saveSiteSettings(e){e.preventDefault();if(!isAdmin())return;let s=siteSettings();s.name=sn.value.trim()||'FriendHub RP';s.city=sc.value.trim()||'City Management';s.description=sd.value.trim();s.footer=sf.value.trim();let f=si.files[0];const done=()=>{W(DB.settings,s);logAction('แก้ไขการตั้งค่าเว็บไซต์',s.name);renderTop();adminTab('settings')};if(f){if(f.size>2*1024*1024)return alert('รูปต้องไม่เกิน 2 MB');let r=new FileReader();r.onload=()=>{s.logo=r.result;done()};r.readAsDataURL(f)}else done()}
function renderTop(){let u=me(),s=siteSettings();sideName.textContent=u.username;sideRole.textContent=u.roleName;topBadge.textContent=u.roleName;if(isAdmin())adminNav.classList.remove('hidden');document.title=s.name+' | RP';document.querySelector('.brand b').textContent=s.name;document.querySelector('.brand small').textContent=s.city;document.querySelector('.footer').textContent=s.footer||s.name+' • City Management';const mark=document.querySelector('.brand-mark');if(s.logo){mark.innerHTML='<img src=\"'+s.logo+'\" style=\"width:100%;height:100%;object-fit:cover;border-radius:11px\">'}else mark.textContent='F'}
renderTop();render();

function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modalBg.classList.add('show')}
function closeModal(){modalBg.classList.remove('show')}
modalBg.onclick=e=>{if(e.target===modalBg)closeModal()}
function layoutHead(ey,h,p,actions=''){return `<div class="page-head"><div><div class="eyebrow">${ey}</div><h1>${h}</h1><p>${p}</p></div><div class="actions">${actions}</div></div>`}
function render(){
 currentPage=location.hash.slice(1)||'home';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));crumb.textContent=pageNames[currentPage]||'FriendHub RP';side.classList.remove('open');
 const fn=window['page_'+currentPage]||page_home;view.innerHTML=fn();afterRender();window.scrollTo({top:0,behavior:'smooth'})
}
function afterRender(){if(currentPage==='home')renderHome();if(currentPage==='news')renderNews();if(currentPage==='dispatch')renderDispatch();if(currentPage==='appointments')renderAppointments();if(currentPage==='cases')renderCases();if(currentPage==='dm')renderDM();if(currentPage==='deptnews')renderDeptNews();if(currentPage==='dept')renderDept();if(currentPage==='id')renderID();if(currentPage==='admin')renderAdmin()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.page);
window.onhashchange=render;

function page_home(){let c=charOf(me().username)||{};return layoutHead('CITY OVERVIEW','ศูนย์กลางเมือง RP','ข้อมูลสำคัญของตัวละครและบริการเมืองในหน้าเดียว')+`<div class="grid">
<div class="card span3"><div class="stat"><div class="stat-icon">👤</div><div><strong>${esc(c.level||1)}</strong><small>Level ตัวละคร</small></div></div></div>
<div class="card span3"><div class="stat"><div class="stat-icon">🏢</div><div><strong style="font-size:16px">${esc(c.job||'พลเมือง')}</strong><small>อาชีพ / หน่วยงาน</small></div></div></div>
<div class="card span3"><div class="stat"><div class="stat-icon">🚨</div><div><strong>${R(DB.dispatch).filter(x=>x.status!=='ปิดเคส').length}</strong><small>เหตุที่ยังเปิด</small></div></div></div>
<div class="card span8"><h2>📰 ข่าวล่าสุด</h2><p class="muted">ข่าวเมืองและประกาศสำคัญ</p><div id="homeNews" style="margin-top:14px"></div></div>
<div class="card span4"><h2>📅 นัดหมายถัดไป</h2><p class="muted">รายการนัดหมายของเมือง</p><div id="homeAppt" style="margin-top:14px"></div></div>
<div class="card span12"><h2>⚡ เมนูด่วน</h2><div class="actions" style="margin-top:14px"><button class="btn soft" onclick="location.hash='profile'">👤 ดูโปรไฟล์</button><button class="btn red" onclick="location.hash='dispatch'">🚨 แจ้งเหตุ</button><button class="btn green" onclick="location.hash='appointments'">📅 นัดหมาย</button><button class="btn dark" onclick="location.hash='dm'">💬 ข้อความส่วนตัว</button></div></div></div>`}
function renderHome(){homeNews.innerHTML=R(DB.posts).slice(0,3).map(postCard).join('')||'<div class="empty">ยังไม่มีข่าว</div>';homeAppt.innerHTML=R(DB.appointments).slice(0,4).map(a=>`<div class="post"><b>${esc(a.title)}</b><div class="post-meta">${esc(a.date)} • ${esc(a.time)} • ${esc(a.place)}</div></div>`).join('')||'<div class="empty">ไม่มีนัดหมาย</div>'}

function page_profile(){let u=me(),c=charOf(u.username)||{},so=socialOf(u.username),need=levelNeed(c.level||1),pct=Math.min(100,Math.round((c.xp||0)/need*100));return layoutHead('CHARACTER PROFILE','โปรไฟล์ตัวละคร','ข้อมูลประจำตัวสำหรับการเล่น Roleplay',`<button class="btn primary" onclick="editProfile()">✏️ แก้ไขโปรไฟล์</button>`)+`<div class="grid"><section class="card span8"><div class="profile"><div class="avatar">${c.photo?`<img src="${c.photo}">`:'👤'}</div><div><h2>${esc(c.name||'ยังไม่ได้ตั้งชื่อ')}</h2><p>${esc(c.job||'พลเมือง')} • ${esc(c.rank||'พลเมือง')}</p><div class="actions" style="margin-top:7px"><span class="badge b-blue">Level ${c.level||1}</span><span class="badge b-purple">${c.xp||0} XP</span></div></div></div><div style="margin-top:22px"><div class="muted">XP สู่ Level ถัดไป ${c.xp||0} / ${need}</div><div class="progress" style="margin-top:7px"><i style="width:${pct}%"></i></div></div><div style="margin-top:17px">${[['วันเกิด',c.dob],['เพศ',c.gender],['โทรศัพท์',c.phone],['อาชีพ',c.job],['ประวัติย่อ',c.bio]].map(x=>`<div class="kv"><b>${x[0]}</b><span>${esc(x[1]||'-')}</span></div>`).join('')}</div></section><section class="card span4"><h2>🏆 สถานะตัวละคร</h2><div class="kv"><b>ยศ</b><span>${esc(c.rank||'พลเมือง')}</span></div><div class="kv"><b>Level</b><span>${c.level||1}</span></div><div class="kv"><b>เงิน</b><span>$${Number(c.money||0).toLocaleString()}</span></div><div class="kv"><b>หน่วยงาน</b><span>${esc(c.job||'พลเมือง')}</span></div></section><section class="card span12"><h2>🔗 Social / ช่องทางติดต่อ</h2><p class="muted">เชื่อมบัญชีสำหรับให้ Admin ตรวจสอบช่องทางติดต่อได้</p><div class="grid" style="margin-top:12px"><div class="card span6"><b>💬 Discord</b><p class="muted">${so.discord?esc(so.discord.display||so.discord.id):'ยังไม่ได้เชื่อมต่อ'}</p><button class="btn soft" onclick="connectSocial('discord')">${so.discord?'✏️ แก้ไข':'🔗 เชื่อมต่อ'} Discord</button></div><div class="card span6"><b>🎮 Xbox / Microsoft</b><p class="muted">${so.xbox?esc(so.xbox.display||so.xbox.id):'ยังไม่ได้เชื่อมต่อ'}</p><button class="btn soft" onclick="connectSocial('xbox')">${so.xbox?'✏️ แก้ไข':'🔗 เชื่อมต่อ'} Xbox</button></div></div></section></div>`}
function editProfile(){let c=charOf(me().username)||{};openModal('แก้ไขโปรไฟล์ตัวละคร',`<form id="profileForm"><div class="row2"><div class="field"><label>ชื่อ-นามสกุลตัวละคร</label><input class="input" id="pname" value="${esc(c.name)}" required></div><div class="field"><label>วันเกิด</label><input class="input" id="pdob" value="${esc(c.dob)}"></div></div><div class="row2"><div class="field"><label>เพศ</label><select class="select" id="pgender"><option ${c.gender==='ชาย'?'selected':''}>ชาย</option><option ${c.gender==='หญิง'?'selected':''}>หญิง</option><option ${c.gender==='อื่น ๆ'?'selected':''}>อื่น ๆ</option></select></div><div class="field"><label>เบอร์โทรศัพท์</label><input class="input" id="pphone" value="${esc(c.phone)}"></div></div><div class="field"><label>ประวัติย่อ</label><textarea class="textarea" id="pbio">${esc(c.bio)}</textarea></div><div class="field"><label>รูปโปรไฟล์</label><input class="input" id="pphoto" type="file" accept="image/*"></div><button class="btn primary">บันทึก</button></form>`);profileForm.onsubmit=e=>{e.preventDefault();let a=R(DB.chars),x=a.find(q=>q.username===me().username);Object.assign(x,{name:pname.value.trim(),dob:pdob.value.trim(),gender:pgender.value,phone:pphone.value.trim(),bio:pbio.value.trim()});let f=pphoto.files[0];if(f){if(f.size>2*1024*1024)return alert('รูปต้องไม่เกิน 2 MB');let r=new FileReader();r.onload=()=>{x.photo=r.result;W(DB.chars,a);closeModal();render()};r.readAsDataURL(f)}else{W(DB.chars,a);closeModal();render()}}}

function connectSocial(provider,username=me().username){let so=socialOf(username),cur=provider==='discord'?so.discord:so.xbox;openModal('🔗 เชื่อมต่อ '+(provider==='discord'?'Discord':'Xbox / Microsoft'),`<p class="muted">สำหรับเวอร์ชันนี้สามารถบันทึกบัญชี Social ได้ทันที ส่วน OAuth จริงต้องตั้งค่า Client ID และ Server Callback</p><div class="field"><label>ชื่อที่แสดง</label><input class="input" id="socialDisplay" value="${esc(cur?.display||'')}"></div><div class="field"><label>รหัสบัญชี / User ID</label><input class="input" id="socialId" value="${esc(cur?.id||'')}"></div><div class="actions"><button class="btn primary" onclick="saveSocialLink('${provider}','${username}')">💾 บันทึก</button><button class="btn red" onclick="removeSocialLink('${provider}','${username}')">ลบการเชื่อมต่อ</button></div>`)}
function saveSocialLink(provider,username){let s=socialOf(username);s[provider]={display:socialDisplay.value.trim(),id:socialId.value.trim(),connectedAt:now(),method:'manual'};saveSocial(s);logAudit('เชื่อม Social',username,(provider==='discord'?'Discord':'Xbox')+' '+s[provider].display);closeModal();if(location.hash==='#admin')renderAdmin();else render()}
function removeSocialLink(provider,username){let s=socialOf(username);s[provider]=null;saveSocial(s);logAudit('ยกเลิก Social',username,provider);closeModal();if(location.hash==='#admin')renderAdmin();else render()}

function page_dept(){return layoutHead('ORGANIZATIONS','หน่วยงาน / อาชีพ','ดูหน่วยงาน ตำแหน่งหัวหน้า และสมาชิกในเมือง',roleOk(['admin','superadmin'])?`<button class="btn primary" onclick="addDept()">＋ เพิ่มหน่วยงาน</button>`:'')+`<div class="grid" id="deptGrid"></div>`}
function renderDept(){deptGrid.innerHTML=R(DB.departments).map(d=>`<section class="card span4 dept"><h2 style="font-size:17px">${esc(d.name)}</h2><p class="muted">หัวหน้า: ${esc(d.chief||'ยังไม่กำหนด')}</p><div class="actions" style="margin:10px 0"><span class="badge b-green">${d.members.length} สมาชิก</span></div><div class="muted">${d.members.length?d.members.map(x=>`• ${esc(x)}`).join('<br>'):'ยังไม่มีสมาชิก'}</div><div class="actions" style="margin-top:14px"><button class="btn soft" onclick="viewDept('${d.id}')">ดูรายละเอียด</button>${roleOk(['admin','superadmin'])?`<button class="btn ghost" onclick="addMember('${d.id}')">＋ สมาชิก</button>`:''}</div></section>`).join('')}
function addDept(){openModal('เพิ่มหน่วยงาน',`<form id="df"><div class="field"><label>ชื่อหน่วยงาน</label><input class="input" id="dn" required></div><div class="field"><label>หัวหน้าหน่วย</label><input class="input" id="dc"></div><button class="btn primary">สร้างหน่วยงาน</button></form>`);df.onsubmit=e=>{e.preventDefault();let a=R(DB.departments);a.push({id:uid('dept'),name:dn.value.trim(),chief:dc.value.trim(),members:[]});W(DB.departments,a);closeModal();render()}}
function addMember(id){openModal('เพิ่มสมาชิกหน่วยงาน',`<form id="mf"><div class="field"><label>Username</label><select class="select" id="mu">${R(DB.users).map(u=>`<option>${esc(u.username)}</option>`).join('')}</select></div><button class="btn primary">เพิ่มสมาชิก</button></form>`);mf.onsubmit=e=>{e.preventDefault();let a=R(DB.departments),d=a.find(x=>x.id===id);if(d&&!d.members.includes(mu.value))d.members.push(mu.value);W(DB.departments,a);closeModal();render()}}
function viewDept(id){let d=R(DB.departments).find(x=>x.id===id);openModal(d.name,`<div class="kv"><b>หัวหน้า</b><span>${esc(d.chief||'-')}</span></div><div class="kv"><b>สมาชิก</b><span>${d.members.length?d.members.map(esc).join(', '):'ไม่มี'}</span></div>`)}
function page_id(){let c=charOf(me().username),id=R(DB.ids).find(x=>x.char===c?.id),ls=R(DB.licenses).filter(x=>x.char===c?.id);return layoutHead('IDENTITY & LICENSE','บัตรประชาชน / ใบอนุญาต','เอกสารประจำตัวสำหรับการตรวจสอบในเมือง')+`<div class="grid"><section class="card span6"><div class="id-card"><div class="id-top"><div class="avatar">${c?.photo?`<img src="${c.photo}">`:'🪪'}</div><div><span class="badge b-blue">CITY ID</span><h2 style="margin:7px 0">${esc(c?.name)}</h2><div class="muted">เลขบัตร: ${esc(id?.number||'ยังไม่ออกบัตร')}</div></div></div><div style="margin-top:16px">${[['วันเกิด',c?.dob],['เพศ',c?.gender],['อาชีพ',c?.job],['ยศ',c?.rank]].map(x=>`<div class="kv"><b>${x[0]}</b><span>${esc(x[1]||'-')}</span></div>`).join('')}</div></div></section><section class="card span6"><h2>📄 ใบอนุญาตของฉัน</h2><div style="margin-top:13px">${ls.length?ls.map(l=>`<div class="license"><span class="badge b-green">${esc(l.status)}</span><h3>${esc(l.type)}</h3><div class="muted">เลขที่ ${esc(l.number)} • ออก ${esc(l.issued)} • หมดอายุ ${esc(l.expire)}</div></div>`).join(''):'<div class="empty">ยังไม่มีใบอนุญาต</div>'}</div></section></div>`}

function postCard(p,controls=''){return `<article class="post ${p.type==='news'?'news':''}"><span class="badge ${p.type==='news'?'b-blue':'b-orange'}">${p.type==='news'?'ข่าวเมือง':'ประกาศ'}</span><h3>${esc(p.title)}</h3><p>${esc(p.body||'')}</p>${p.image?`<img src="${p.image}" alt="">`:''}<div class="post-meta">โดย ${esc(p.author)} • ${esc(p.time)} ${p.edited?'• แก้ไขล่าสุด':''}</div>${controls}</article>`}
function page_news(){let can=roleOk(['rank1','admin','superadmin']);return layoutHead('CITY NEWS','ข่าวเมือง / หนังสือพิมพ์','ศูนย์กลางข่าวสารของเมือง',can?`<button class="btn primary" onclick="newPost('news')">＋ ลงข่าว</button>`:'')+`<section class="card"><div id="newsList"></div></section>`}
function renderNews(){let a=R(DB.posts);let u=me();newsList.innerHTML=a.length?a.map(p=>{let controls=(roleOk(['admin','superadmin'])||p.author===u.username&&roleOk(['rank1','rank2']))?`<div class="actions" style="margin-top:10px"><button class="btn soft" onclick="editPost('${p.id}')">✏️ แก้ไข</button><button class="btn red" onclick="deletePost('${p.id}')">🗑️ ลบ</button></div>`:'';return postCard(p,controls)}).join(''):'<div class="empty">ยังไม่มีข่าวเมือง</div>'}
function newPost(type='news',dept=''){openModal(type==='news'?'ลงข่าวเมือง':'ประกาศหน่วยงาน',`<form id="postForm"><div class="field"><label>หัวข้อ</label><input class="input" id="pt" required maxlength="120"></div><div class="field"><label>เนื้อหา</label><textarea class="textarea" id="pb" required maxlength="2000"></textarea></div><div class="field"><label>รูปภาพ (ไม่เกิน 2 MB)</label><input class="input" id="pi" type="file" accept="image/*"></div><button class="btn primary">เผยแพร่</button></form>`);postForm.onsubmit=e=>{e.preventDefault();let a=dept?R(DB.deptPosts):R(DB.posts),obj={id:uid('post'),title:pt.value.trim(),body:pb.value.trim(),author:me().username,time:now()};if(dept)obj.dept=dept;else obj.type=type;let f=pi.files[0];const save=img=>{obj.image=img||'';a.unshift(obj);W(dept?DB.deptPosts:DB.posts,a);closeModal();render()};if(f){if(f.size>2*1024*1024)return alert('รูปต้องไม่เกิน 2 MB');let r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save('')}}
function editPost(id){let a=R(DB.posts),p=a.find(x=>x.id===id);if(!p)return;openModal('แก้ไขข่าว',`<form id="ep"><div class="field"><label>หัวข้อ</label><input class="input" id="et" value="${esc(p.title)}" required></div><div class="field"><label>เนื้อหา</label><textarea class="textarea" id="eb" required>${esc(p.body)}</textarea></div><div class="field"><label>เปลี่ยนรูป (เว้นว่างเพื่อใช้รูปเดิม)</label><input class="input" id="ei" type="file" accept="image/*"></div><button class="btn primary">บันทึกการแก้ไข</button></form>`);ep.onsubmit=e=>{e.preventDefault();p.title=et.value.trim();p.body=eb.value.trim();p.edited=true;let f=ei.files[0];const save=()=>{W(DB.posts,a);closeModal();render()};if(f){if(f.size>2*1024*1024)return alert('รูปต้องไม่เกิน 2 MB');let r=new FileReader();r.onload=()=>{p.image=r.result;save()};r.readAsDataURL(f)}else save()}}
function deletePost(id){if(!confirm('ยืนยันลบข่าวนี้หรือไม่?'))return;W(DB.posts,R(DB.posts).filter(x=>x.id!==id));render()}

function page_dispatch(){return layoutHead('EMERGENCY DISPATCH','🚨 ระบบแจ้งเหตุ / Dispatch','แจ้งเหตุและติดตามสถานะหน่วยปฏิบัติการ',`<button class="btn red" onclick="newCall()">＋ แจ้งเหตุ</button>`)+`<section class="card"><div id="dispatchList"></div></section>`}
function renderDispatch(){let can=roleOk(['rank1','rank2','admin','superadmin']);dispatchList.innerHTML=R(DB.dispatch).map(x=>`<article class="post dispatch"><span class="badge ${x.status==='ปิดเคส'?'b-gray':x.status==='กำลังดำเนินการ'?'b-blue':'b-red'}">${esc(x.status)}</span><h3>CALL ${esc(x.id)} • ${esc(x.type)}</h3><p><b>สถานที่:</b> ${esc(x.location)}<br><b>รายละเอียด:</b> ${esc(x.detail)}</p><div class="post-meta">ผู้แจ้ง ${esc(x.sender)} • ${esc(x.time)} ${x.assigned?'• รับงานโดย '+esc(x.assigned):''}</div>${can&&x.status!=='ปิดเคส'?`<div class="actions" style="margin-top:10px"><button class="btn soft" onclick="takeCall('${x.id}')">${x.assigned?'อัปเดตสถานะ':'🚓 รับงาน'}</button><button class="btn ghost" onclick="closeCall('${x.id}')">ปิดเคส</button></div>`:''}</article>`).join('')||'<div class="empty">ยังไม่มีเหตุ</div>'}
function newCall(){openModal('แจ้งเหตุ Dispatch',`<form id="cf"><div class="row2"><div class="field"><label>ประเภทเหตุ</label><select class="select" id="ct"><option>อุบัติเหตุ</option><option>เหตุร้าย</option><option>ผู้บาดเจ็บ</option><option>ไฟไหม้</option><option>ขอความช่วยเหลือ</option><option>อื่น ๆ</option></select></div><div class="field"><label>สถานที่</label><input class="input" id="cl" required></div></div><div class="field"><label>รายละเอียด</label><textarea class="textarea" id="cd" required></textarea></div><button class="btn red">ส่งแจ้งเหตุ</button></form>`);cf.onsubmit=e=>{e.preventDefault();let a=R(DB.dispatch);a.unshift({id:uid('CALL'),type:ct.value,location:cl.value.trim(),detail:cd.value.trim(),sender:me().username,status:'รอหน่วยงาน',time:now(),assigned:''});W(DB.dispatch,a);addXP(me().username,30);closeModal();render()}}
function takeCall(id){let a=R(DB.dispatch),x=a.find(q=>q.id===id);x.assigned=me().username;x.status='กำลังดำเนินการ';W(DB.dispatch,a);addXP(me().username,50);render()}
function closeCall(id){let a=R(DB.dispatch),x=a.find(q=>q.id===id);x.status='ปิดเคส';W(DB.dispatch,a);render()}

function page_appointments(){return layoutHead('SCHEDULE','📅 ระบบนัดหมาย','สร้างและติดตามการประชุม เวร และกิจกรรม',`<button class="btn primary" onclick="newAppointment()">＋ เพิ่มนัดหมาย</button>`)+`<section class="card"><div id="apptList"></div></section>`}
function renderAppointments(){let a=R(DB.appointments);apptList.innerHTML=a.length?a.map(x=>`<article class="post"><span class="badge b-blue">${esc(x.date)}</span><h3>${esc(x.title)}</h3><p>${esc(x.detail||'')}</p><div class="post-meta">เวลา ${esc(x.time)} • สถานที่ ${esc(x.place)} • สร้างโดย ${esc(x.owner)}</div><div class="actions" style="margin-top:9px"><button class="btn red" onclick="delAppointment('${x.id}')">ลบ</button></div></article>`).join(''):'<div class="empty">ยังไม่มีนัดหมาย</div>'}
function newAppointment(){openModal('เพิ่มนัดหมาย',`<form id="af"><div class="field"><label>หัวข้อ</label><input class="input" id="at" required></div><div class="row2"><div class="field"><label>วันที่</label><input class="input" id="ad" placeholder="25/08/2026" required></div><div class="field"><label>เวลา</label><input class="input" id="am" placeholder="20:00" required></div></div><div class="field"><label>สถานที่</label><input class="input" id="ap" required></div><div class="field"><label>รายละเอียด</label><textarea class="textarea" id="ax"></textarea></div><button class="btn primary">บันทึกนัดหมาย</button></form>`);af.onsubmit=e=>{e.preventDefault();let a=R(DB.appointments);a.unshift({id:uid('appt'),title:at.value.trim(),date:ad.value.trim(),time:am.value.trim(),place:ap.value.trim(),detail:ax.value.trim(),owner:me().username});W(DB.appointments,a);closeModal();render()}}
function delAppointment(id){if(!confirm('ลบนัดหมายนี้หรือไม่?'))return;W(DB.appointments,R(DB.appointments).filter(x=>x.id!==id));render()}

function page_rank(){let c=charOf(me().username)||{},need=levelNeed(c.level||1),pct=Math.round((c.xp||0)/need*100);return layoutHead('RANKING','🏆 ระบบยศ / Level / XP','พัฒนาตัวละครจากกิจกรรมในเมือง')+`<div class="grid"><section class="card span6"><h2>ระดับตัวละคร</h2><div class="profile" style="margin-top:15px"><div class="avatar">🏆</div><div><h2>Level ${c.level||1}</h2><p>${esc(c.rank||'พลเมือง')} • ${c.xp||0} / ${need} XP</p></div></div><div class="progress" style="margin-top:18px"><i style="width:${pct}%"></i></div><div class="muted" style="margin-top:8px">${pct}% สู่ Level ถัดไป</div></section><section class="card span6"><h2>ยศในเมือง</h2><div class="timeline" style="margin-top:15px">${RANKS.map((r,i)=>`<div class="timeline-item"><b>${i+1}. ${esc(r)}</b>${r===c.rank?'<span class="badge b-green" style="margin-left:7px">ปัจจุบัน</span>':''}<p>ระดับตำแหน่ง RP</p></div>`).join('')}</div></section><section class="card span12"><h2>กิจกรรมที่ได้รับ XP</h2><div class="grid" style="margin-top:12px"><div class="card span4"><b>🚨 รับ Dispatch</b><p class="muted">+50 XP</p></div><div class="card span4"><b>📢 สร้างข่าว</b><p class="muted">+40 XP</p></div><div class="card span4"><b>📅 เข้าร่วมกิจกรรม</b><p class="muted">+30 XP</p></div></div></section></div>`}

function page_cases(){let can=roleOk(['admin','superadmin','rank1']);return layoutHead('LEGAL RECORDS','⚖️ คดี / ประวัติอาชญากรรม','ข้อมูลคดีและประวัติสำหรับเจ้าหน้าที่ที่ได้รับสิทธิ์',can?`<button class="btn primary" onclick="newCase()">＋ เปิดคดี</button>`:'')+`<section class="card"><div id="caseList"></div></section>`}
function renderCases(){let a=R(DB.cases);caseList.innerHTML=a.map(x=>`<article class="post case"><span class="badge ${x.status==='ปิดคดี'?'b-green':'b-orange'}">${esc(x.status)}</span><h3>${esc(x.number)} • ${esc(x.charge)}</h3><p>${esc(x.detail)}</p><div class="post-meta">ผู้เกี่ยวข้อง: ${esc(charOf(x.citizen)?.name||x.citizen)} • เจ้าหน้าที่: ${esc(x.officer)} • ปรับ $${Number(x.fine||0).toLocaleString()} • ${esc(x.date)}</div></article>`).join('')||'<div class="empty">ยังไม่มีคดี</div>'}
function newCase(){openModal('เปิดคดีใหม่',`<form id="caseForm"><div class="row2"><div class="field"><label>ผู้เกี่ยวข้อง</label><select class="select" id="cc">${R(DB.chars).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>ข้อหา</label><input class="input" id="chg" required></div></div><div class="field"><label>รายละเอียด</label><textarea class="textarea" id="cdetail" required></textarea></div><div class="field"><label>ค่าปรับ</label><input class="input" id="fine" type="number" min="0" value="0"></div><button class="btn primary">บันทึกคดี</button></form>`);caseForm.onsubmit=e=>{e.preventDefault();let a=R(DB.cases);a.unshift({id:uid('case'),number:'CASE-'+Math.floor(Math.random()*9000+1000),citizen:cc.value,charge:chg.value.trim(),detail:cdetail.value.trim(),fine:Number(fine.value||0),status:'อยู่ระหว่างดำเนินคดี',officer:me().username,date:dateOnly()});W(DB.cases,a);closeModal();render()}}
function page_dm(){return layoutHead('PRIVATE MESSAGING','💬 แชทส่วนตัว','ส่งข้อความหาผู้ใช้งานคนอื่นแบบตัวต่อตัว')+`<section class="card"><div class="chat-layout"><div class="chat-users" id="dmUsers"></div><div class="chat-window"><div class="messages" id="dmMessages"></div><div class="composer"><input id="dmInput" class="input" placeholder="พิมพ์ข้อความส่วนตัว..."><button class="btn primary" onclick="sendDM()">ส่ง</button></div></div></div></section>`}
function renderDM(){let u=me().username,users=R(DB.users).filter(x=>x.username!==u);if(!dmTarget&&users[0])dmTarget=users[0].username;dmUsers.innerHTML=users.map(x=>`<div class="chat-user ${x.username===dmTarget?'active':''}" onclick="dmTarget='${x.username}';renderDM()"><b>👤 ${esc(x.username)}</b><small>${esc(x.roleName)}</small></div>`).join('');let msgs=R(DB.dm).filter(x=>(x.from===u&&x.to===dmTarget)||(x.from===dmTarget&&x.to===u));dmMessages.innerHTML=msgs.map(x=>`<div class="msg ${x.from===u?'me':''}"><div class="bubble">${esc(x.text)}<div class="msg-time">${esc(x.time)}</div></div></div>`).join('')||'<div class="empty">เริ่มการสนทนา</div>';dmMessages.scrollTop=dmMessages.scrollHeight}
function sendDM(){let v=dmInput.value.trim();if(!v||!dmTarget)return;let a=R(DB.dm);a.push({id:uid('dm'),from:me().username,to:dmTarget,text:v,time:now()});W(DB.dm,a);dmInput.value='';renderDM()}

function page_deptnews(){return layoutHead('DEPARTMENT BULLETINS','📌 ประกาศของหน่วยงาน','ประกาศภายในแต่ละหน่วยงาน',`<button class="btn primary" onclick="newDeptPost()">＋ สร้างประกาศ</button>`)+`<section class="card"><div class="field"><label>เลือกหน่วยงาน</label><select class="select" id="deptFilter" onchange="renderDeptNews()">${DEPTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="deptNewsList"></div></section>`}

function newDeptPost(){openModal('สร้างประกาศหน่วยงาน',`<form id="dpf"><div class="field"><label>หน่วยงาน</label><select class="select" id="dpd">${DEPTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>หัวข้อ</label><input class="input" id="dpt" required></div><div class="field"><label>รายละเอียด</label><textarea class="textarea" id="dpb" required></textarea></div><button class="btn primary">เผยแพร่</button></form>`);dpf.onsubmit=e=>{e.preventDefault();let a=R(DB.deptPosts);a.unshift({id:uid('dp'),dept:dpd.value,title:dpt.value.trim(),body:dpb.value.trim(),author:me().username,time:now()});W(DB.deptPosts,a);addXP(me().username,40);closeModal();render()}}
function deleteDeptPost(id){if(!confirm('ลบประกาศนี้หรือไม่?'))return;W(DB.deptPosts,R(DB.deptPosts).filter(x=>x.id!==id));render()}

function page_admin(){if(!roleOk(['admin','superadmin']))return layoutHead('ACCESS DENIED','ไม่มีสิทธิ์เข้าถึง','หน้านี้สงวนสำหรับแอดมิน');return layoutHead('ADMINISTRATION','⚙️ จัดการระบบ','จัดการบัญชี ผู้ใช้ ยศ ค้นหา และตรวจสอบข้อมูลผู้ใช้ทั้งหมด',`<button class="btn primary" onclick="newUser()">＋ เพิ่มผู้ใช้</button>`)+`<div class="grid"><section class="card span12"><div class="row2"><div class="field"><label>🔎 ค้นหาผู้ใช้</label><input class="input" id="adminSearch" placeholder="ค้นหา Username / ชื่อตัวละคร / Discord / Xbox / หน่วยงาน / ยศ" oninput="renderAdmin()"></div><div class="field"><label>ตัวกรอง</label><select class="select" id="adminRoleFilter" onchange="renderAdmin()"><option value="">ทุกระดับ</option>${Object.keys(ROLE_NAMES).map(k=>`<option value="${k}">${esc(ROLE_NAMES[k])}</option>`).join('')}</select></div></div><div class="muted" style="margin:6px 0 12px">เลือกผู้ใช้เพื่อดูประวัติแบบรวมทั้งหมด</div><div class="table-wrap"><table><thead><tr><th>ผู้ใช้</th><th>สิทธิ์</th><th>ยศ / หน่วยงาน</th><th>Social</th><th>จัดการ</th></tr></thead><tbody id="userTable"></tbody></table></div></section><section class="card span12"><h2>📜 ประวัติการใช้งานล่าสุด</h2><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>เวลา</th><th>บัญชี</th><th>วิธีเข้าสู่ระบบ</th></tr></thead><tbody id="loginHistoryTable"></tbody></table></div></section><section class="card span6"><h2>🔐 ชื่อระดับสิทธิ์</h2><p class="muted">กำหนดชื่อที่แสดงในระบบ</p><div id="roleSettings" style="margin-top:12px"></div></section><section class="card span6"><h2>🏅 ชื่อยศตัวละคร</h2><p class="muted">แก้ชื่อยศที่ใช้ในโปรไฟล์และระบบ Level / XP</p><div id="rankSettings" style="margin-top:12px"></div></section></div>`}
function renderAdmin(){let q=(document.getElementById('adminSearch')?.value||'').trim().toLowerCase(),rf=document.getElementById('adminRoleFilter')?.value||'';let users=R(DB.users).filter(u=>{let c=charOf(u.username)||{},so=socialOf(u.username);let hay=[u.username,c.name,c.job,c.rank,so.discord?.display,so.discord?.id,so.xbox?.display,so.xbox?.id].filter(Boolean).join(' ').toLowerCase();return (!q||hay.includes(q))&&(!rf||u.role===rf)});userTable.innerHTML=users.map(u=>{let c=charOf(u.username)||{},so=socialOf(u.username);return `<tr><td><b>${esc(u.username)}</b><div class="muted" style="font-size:12px">สมัคร: ${esc(u.createdAt||'-')}</div></td><td><span class="badge b-purple">${esc(ROLE_NAMES[u.role]||u.roleName)}</span></td><td>${esc(c.rank||'พลเมือง')}<div class="muted">${esc(c.job||'พลเมือง')}</div></td><td>${so.discord?`💬 ${esc(so.discord.display||so.discord.id)}`:'—'}<br>${so.xbox?`🎮 ${esc(so.xbox.display||so.xbox.id)}`:'—'}</td><td><div class="actions"><button class="btn soft" onclick="viewUserHistory('${u.username}')">👁️ ประวัติ</button><button class="btn soft" onclick="editUser('${u.username}')">✏️ แก้ไข</button>${u.username!=='admin_big'?`<button class="btn red" onclick="removeUser('${u.username}')">🗑️ ลบ</button>`:''}</div></td></tr>`}).join('')||`<tr><td colspan="5" class="empty">ไม่พบผู้ใช้</td></tr>`;renderRoleSettings();renderRankSettings();let logs=R(DB.loginLogs).slice(0,30);loginHistoryTable.innerHTML=logs.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.username)}</td><td>${esc(x.method)}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">ยังไม่มีประวัติการเข้าสู่ระบบ</td></tr>`}
function viewUserHistory(username){let u=R(DB.users).find(x=>x.username===username),c=charOf(username)||{},so=socialOf(username),id=R(DB.ids).find(x=>x.char===c.id),lic=R(DB.licenses).filter(x=>x.char===c.id),cases=R(DB.cases).filter(x=>x.citizen===c.id),dispatch=R(DB.dispatch).filter(x=>x.sender===username||x.assigned===username),appts=R(DB.appointments).filter(x=>x.owner===username),posts=R(DB.posts).filter(x=>x.author===username),deptPosts=R(DB.deptPosts).filter(x=>x.author===username),logins=R(DB.loginLogs).filter(x=>x.username===username).slice(0,20),audits=R(DB.audit).filter(x=>x.target===username).slice(0,30);openModal('👤 ประวัติผู้ใช้: '+username,`<div class="grid"><section class="card span6"><h3>บัญชี</h3><div class="kv"><b>Username</b><span>${esc(u?.username)}</span></div><div class="kv"><b>ระดับสิทธิ์</b><span>${esc(ROLE_NAMES[u?.role]||u?.roleName)}</span></div><div class="kv"><b>สมัครเมื่อ</b><span>${esc(u?.createdAt||'-')}</span></div><div class="kv"><b>ชื่อ</b><span>${esc(c.name||'-')}</span></div><div class="kv"><b>หน่วยงาน</b><span>${esc(c.job||'-')}</span></div><div class="kv"><b>ยศ</b><span>${esc(c.rank||'-')}</span></div><div class="kv"><b>Level / XP</b><span>${c.level||1} / ${c.xp||0}</span></div></section><section class="card span6"><h3>🔗 Social</h3><div class="kv"><b>Discord</b><span>${so.discord?esc(so.discord.display||so.discord.id):'ยังไม่เชื่อม'}</span></div><div class="kv"><b>Xbox</b><span>${so.xbox?esc(so.xbox.display||so.xbox.id):'ยังไม่เชื่อม'}</span></div><p class="muted">รหัสผ่านจะไม่แสดงในประวัติ Admin</p></section><section class="card span6"><h3>🪪 เอกสาร</h3><div class="kv"><b>บัตรประชาชน</b><span>${id?esc(id.number)+' • '+esc(id.status):'ไม่มี'}</span></div><div class="kv"><b>ใบอนุญาต</b><span>${lic.length} รายการ</span></div>${lic.map(l=>`<div class="post"><b>${esc(l.type)}</b><div class="muted">${esc(l.number)} • ${esc(l.status)} • หมดอายุ ${esc(l.expire)}</div></div>`).join('')}</section><section class="card span6"><h3>📊 สรุปประวัติ</h3><div class="kv"><b>คดี</b><span>${cases.length}</span></div><div class="kv"><b>Dispatch</b><span>${dispatch.length}</span></div><div class="kv"><b>นัดหมาย</b><span>${appts.length}</span></div><div class="kv"><b>ข่าว</b><span>${posts.length}</span></div><div class="kv"><b>ประกาศหน่วยงาน</b><span>${deptPosts.length}</span></div><div class="kv"><b>การเข้าสู่ระบบ</b><span>${logins.length}${logins.length>=20?'+':''}</span></div><div class="kv"><b>ข้อความส่วนตัว</b><span>${R(DB.dm).filter(m=>m.from===username||m.to===username).length}</span></div></section><section class="card span12"><h3>📅 นัดหมาย</h3>${appts.map(x=>`<div class="post"><b>${esc(x.title)}</b><div>${esc(x.date)} • ${esc(x.time)} • ${esc(x.place)}</div><div class="post-meta">${esc(x.detail||'')}</div></div>`).join('')||'<div class="empty">ไม่มีนัดหมาย</div>'}</section><section class="card span12"><h3>📢 ข่าวและประกาศ</h3>${posts.map(x=>`<div class="post"><b>${esc(x.title)}</b><div>${esc(x.body||'')}</div><div class="post-meta">${esc(x.time)}</div></div>`).join('')||'<div class="empty">ไม่มีข่าว</div>'}${deptPosts.map(x=>`<div class="post"><b>📌 ${esc(x.title)}</b><div>${esc(x.body||'')}</div><div class="post-meta">${esc(x.dept||'')}</div></div>`).join('')}</section><section class="card span12"><h3>⚖️ คดี</h3>${cases.map(x=>`<div class="post"><b>${esc(x.number)} • ${esc(x.charge)}</b><div>${esc(x.detail)}</div><div class="post-meta">${esc(x.status)} • ${esc(x.date)}</div></div>`).join('')||'<div class="empty">ไม่มีคดี</div>'}</section><section class="card span12"><h3>🚨 Dispatch</h3>${dispatch.map(x=>`<div class="post"><b>${esc(x.id)} • ${esc(x.type)}</b><div>${esc(x.location)} • ${esc(x.status)}</div><div class="post-meta">${esc(x.time)}</div></div>`).join('')||'<div class="empty">ไม่มีประวัติ Dispatch</div>'}</section><section class="card span12"><h3>🔐 ประวัติการเข้าสู่ระบบ</h3>${logins.map(x=>`<div class="post"><b>${esc(x.time)}</b><div class="muted">วิธี: ${esc(x.method)}</div></div>`).join('')||'<div class="empty">ไม่มีประวัติ</div>'}</section><section class="card span12"><h3>📜 Admin Audit</h3>${audits.map(x=>`<div class="post"><b>${esc(x.time)} • ${esc(x.actor)}</b><div>${esc(x.action)} — ${esc(x.detail)}</div></div>`).join('')||'<div class="empty">ไม่มีประวัติการแก้ไขโดย Admin</div>'}</section></div>`)}

function editUser(username){let u=R(DB.users).find(x=>x.username===username),c=charOf(username)||{};if(!u)return;openModal('แก้ไขผู้ใช้ / ยศ',`<form id="editUserForm"><div class="row2"><div class="field"><label>Username</label><input class="input" id="eu" value="${esc(u.username)}" required></div><div class="field"><label>Password</label><input class="input" id="epw" type="password" value="${esc(u.password)}" required></div></div><div class="row2"><div class="field"><label>ระดับสิทธิ์</label><select class="select" id="er">${Object.keys(ROLE_NAMES).map(k=>`<option value="${k}" ${u.role===k?'selected':''}>${esc(ROLE_NAMES[k])}</option>`).join('')}</select></div><div class="field"><label>ยศตัวละคร</label><select class="select" id="eRank">${RANKS.map(r=>`<option ${c.rank===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div></div><div class="row2"><div class="field"><label>ชื่อ-นามสกุลตัวละคร</label><input class="input" id="en" value="${esc(c.name||'')}"></div><div class="field"><label>Level</label><input class="input" id="el" type="number" min="1" value="${c.level||1}"></div></div><div class="field"><label>XP</label><input class="input" id="ex" type="number" min="0" value="${c.xp||0}"></div><button class="btn primary">💾 บันทึกข้อมูล</button></form>`);editUserForm.onsubmit=e=>{e.preventDefault();if(username==='admin_big'&&er.value!=='superadmin')return alert('🔒 Super Admin หลักไม่สามารถลดสิทธิ์ได้');let users=R(DB.users),chars=R(DB.chars),x=users.find(q=>q.username===username),ch=chars.find(q=>q.username===username);let newU=eu.value.trim();if(!newU)return;if(newU!==username&&users.some(q=>q.username===newU))return alert('มี Username นี้แล้ว');x.username=newU;x.password=epw.value;x.role=er.value;x.roleName=ROLE_NAMES[er.value];if(ch){ch.username=newU;ch.name=en.value.trim();ch.rank=eRank.value;ch.level=Math.max(1,Number(el.value||1));ch.xp=Math.max(0,Number(ex.value||0));}W(DB.users,users);W(DB.chars,chars);if(me().username===username){let cur=me();cur.username=newU;cur.role=x.role;cur.roleName=x.roleName;W(DB.current,cur)}closeModal();render()}}
function renderRoleSettings(){roleSettings.innerHTML=Object.entries(ROLE_NAMES).map(([k,v])=>`<div class="field"><label>${k}</label><input class="input role-name" data-role="${k}" value="${esc(v)}"></div>`).join('')+`<button class="btn primary" onclick="saveRoleSettings()">💾 บันทึกชื่อระดับสิทธิ์</button>`}
function saveRoleSettings(){document.querySelectorAll('.role-name').forEach(i=>ROLE_NAMES[i.dataset.role]=i.value.trim()||ROLE_NAMES[i.dataset.role]);syncRoleNamesToUsers();saveRPSettings();alert('บันทึกชื่อระดับสิทธิ์แล้ว');render()}
function renderRankSettings(){rankSettings.innerHTML=RANKS.map((r,i)=>`<div class="row2" style="align-items:end"><div class="field"><label>ยศ ${i+1}</label><input class="input rank-name" data-index="${i}" value="${esc(r)}"></div><button class="btn red" type="button" onclick="removeRank(${i})">ลบ</button></div>`).join('')+`<div class="actions" style="margin-top:10px"><button class="btn soft" onclick="addRank()">＋ เพิ่มยศ</button><button class="btn primary" onclick="saveRankSettings()">💾 บันทึกชื่อยศ</button></div>`}
function saveRankSettings(){RANKS=[...document.querySelectorAll('.rank-name')].map(i=>i.value.trim()).filter(Boolean);if(!RANKS.length)RANKS=['พลเมือง'];saveRPSettings();alert('บันทึกชื่อยศแล้ว');render()}
function addRank(){RANKS.push('ยศใหม่');renderRankSettings()}
function removeRank(i){if(RANKS.length<=1)return alert('ต้องมียศอย่างน้อย 1 ยศ');if(!confirm('ลบยศนี้จากรายการหรือไม่?'))return;RANKS.splice(i,1);saveRPSettings();renderRankSettings()}

function newUser(){openModal('เพิ่มผู้ใช้งาน',`<form id="uf"><div class="row2"><div class="field"><label>Username</label><input class="input" id="uu" required></div><div class="field"><label>Password</label><input class="input" id="up" type="password" required></div></div><div class="field"><label>Role</label><select class="select" id="ur"><option value="user">ผู้ใช้ทั่วไป</option><option value="rank1">ผู้ใช้มียศ 1</option><option value="rank2">ผู้ใช้มียศ 2</option><option value="admin">แอดมินทั่วไป</option><option value="superadmin">แอดมินใหญ่</option></select></div><button class="btn primary">เพิ่มผู้ใช้</button></form>`);uf.onsubmit=e=>{e.preventDefault();let a=R(DB.users);if(a.some(x=>x.username===uu.value.trim()))return alert('มี Username นี้แล้ว');let r=ur.value;a.push({username:uu.value.trim(),password:up.value,role:r,roleName:ROLE_NAMES[r],createdAt:now()});W(DB.users,a);W(DB.chars,[...R(DB.chars),{id:uid('char'),username:uu.value.trim(),name:uu.value.trim(),dob:'',gender:'',phone:'',rank:'พลเมือง',level:1,xp:0,money:0,job:'พลเมือง',bio:''}]);logAudit('สร้างผู้ใช้',uu.value.trim(),'สร้างบัญชีใหม่');closeModal();render()}}
function removeUser(username){if(username==='admin_big')return alert('ไม่สามารถลบแอดมินใหญ่หลักได้');if(!confirm('ลบผู้ใช้นี้หรือไม่?'))return;W(DB.users,R(DB.users).filter(x=>x.username!==username));W(DB.chars,R(DB.chars).filter(x=>x.username!==username));logAudit('ลบผู้ใช้',username,'ลบบัญชีและข้อมูลตัวละคร');render()}

function renderTop(){let u=me();sideName.textContent=u.username;sideRole.textContent=u.roleName;topBadge.textContent=u.roleName;if(['admin','superadmin'].includes(u.role))adminNav.classList.remove('hidden')}
renderTop();render();
</script>
</body>
</html>
